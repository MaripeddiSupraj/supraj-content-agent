[project]
name = "supraj-content-agent"
version = "0.1.0"
description = "Validated content publishing workflow for supraj.dev"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
agents = [
  "openai-agents>=0.4,<1",
]
workflow = [
  "langgraph>=0.6,<1",
]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
supraj-content-agent = "supraj_content_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
